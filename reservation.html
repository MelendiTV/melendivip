<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservation | Melendi VIP</title>
<link rel="canonical" href="https://melendivip.com/reservation.html" />
  <style>
    body{
      margin:0;
      background:#07070b;
      font-family:Arial,sans-serif;
      color:#fff;
      padding:40px 20px;
    }

    .reservation-box{
      max-width:700px;
      margin:auto;
      background:#0f0f15;
      padding:30px;
      border-radius:16px;
      border:1px solid #2a2a2a;
    }

    h1{
      text-align:center;
      color:#d4af37;
      margin-top:0;
      margin-bottom:25px;
    }

    .form-group{
      margin-bottom:16px;
    }

    .two-cols{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
      color:#d4af37;
    }

    input, select, textarea{
      width:100%;
      padding:12px;
      border-radius:8px;
      border:1px solid #444;
      background:#1a1a1f;
      color:white;
      box-sizing:border-box;
      font-size:16px;
    }

    textarea{
      min-height:110px;
      resize:vertical;
    }

    button{
      width:100%;
      padding:16px;
      background:linear-gradient(135deg,#d4af37,#b8962e);
      border:none;
      border-radius:12px;
      color:#000;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      margin-top:10px;
    }

    button:disabled{
      opacity:.7;
      cursor:not-allowed;
    }

    .message{
      margin-top:18px;
      text-align:center;
      font-weight:bold;
    }

    .deposit-box{
      margin-top:8px;
      margin-bottom:18px;
      padding:14px;
      border-radius:10px;
      background:#15151c;
      border:1px solid #2f2f38;
    }

    .deposit-line{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      font-size:16px;
    }

    .deposit-amount{
      color:#d4af37;
      font-weight:bold;
      font-size:18px;
    }

    .deposit-note{
      margin-top:8px;
      color:#cfcfcf;
      font-size:14px;
      line-height:1.4;
    }

    .back-home{
      display:inline-block;
      margin-top:20px;
      background:#d4af37;
      color:#000;
      padding:10px 16px;
      border-radius:8px;
      font-weight:bold;
      text-decoration:none;
    }

    @media (max-width:640px){
      .two-cols{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>

  <div class="reservation-box">
    <h1>VIP Reservation</h1>

    <form id="reservationForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required />
      </div>

      <div class="form-group">
        <label for="phone">Phone / WhatsApp</label>
        <input type="tel" id="phone" name="phone" required />
      </div>

      <div class="form-group">
        <label for="hotel">Hotel</label>
        <input type="text" id="hotel" name="hotel" required />
      </div>

      <div class="form-group">
        <label for="club">Club</label>
        <select id="club" name="club" required>
          <option value="">Select a club</option>
          <option value="Sapphire">Sapphire</option>
          <option value="Crazy Horse III">Crazy Horse III</option>
          <option value="Peppermint Hippo">Peppermint Hippo</option>
          <option value="Spearmint Rhino">Spearmint Rhino</option>
          <option value="Treasures">Treasures</option>
          <option value="Hustler Club">Hustler Club</option>
          <option value="Scores">Scores</option>
          <option value="Little Darlings">Little Darlings</option>
          <option value="LVSC VIP Experience">LVSC VIP Experience</option>
          <option value="Deja Vu">Deja Vu</option>
          <option value="Palomino">Palomino</option>
        </select>
      </div>

      <div class="two-cols">
        <div class="form-group">
          <label for="date">Reservation Date</label>
          <input type="date" id="date" name="date" required />
        </div>

        <div class="form-group">
          <label for="time">Reservation Time</label>
          <input type="time" id="time" name="time" required />
        </div>
      </div>

      <div class="two-cols">
        <div class="form-group">
          <label for="men">Men</label>
          <input type="number" id="men" name="men" min="1" value="1" required />
        </div>

        <div class="form-group">
          <label for="women">Women</label>
          <input type="number" id="women" name="women" min="0" value="0" required />
        </div>
      </div>

      <div class="deposit-box">
        <div class="deposit-line">
          <span>Required Deposit</span>
          <span class="deposit-amount" id="depositAmount">$20</span>
        </div>
        <div class="deposit-note">
          $20 deposit per male guest. Female guests are not charged. Minimum 1 male guest required.
        </div>
      </div>

      <div class="form-group">
        <label for="notes">Extra Notes</label>
        <textarea id="notes" name="notes" placeholder="Pickup details, special requests, etc."></textarea>
      </div>

      <button type="submit" id="submitBtn">Reserve</button>
      <div class="message" id="formMessage"></div>
    </form>

    <a href="/" class="back-home">← Home</a>
  </div>

  <script>
    const webhookURL = "https://hook.us2.make.com/iy3l4sthq0wggcrpby9rntfbglfc9ttq";

    const form = document.getElementById("reservationForm");
    const submitBtn = document.getElementById("submitBtn");
    const formMessage = document.getElementById("formMessage");
    const menInput = document.getElementById("men");
    const womenInput = document.getElementById("women");
    const depositAmount = document.getElementById("depositAmount");

    const params = new URLSearchParams(window.location.search);
    const clubFromURL = params.get("club");

    if (clubFromURL) {
      const clubField = document.getElementById("club");
      clubField.value = decodeURIComponent(clubFromURL);
    }

    function updateDeposit() {
      const men = parseInt(menInput.value, 10) || 0;
      const totalDeposit = men * 20;
      depositAmount.textContent = "$" + totalDeposit;
    }

    menInput.addEventListener("input", updateDeposit);
    womenInput.addEventListener("input", updateDeposit);
    updateDeposit();

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      const men = parseInt(menInput.value, 10) || 0;
      const women = parseInt(womenInput.value, 10) || 0;

      if (men < 1) {
        formMessage.textContent = "Minimum 1 male guest is required to complete the reservation.";
        formMessage.style.color = "#ff4d4d";
        menInput.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";
      formMessage.textContent = "";

      const totalGuests = men + women;
      const deposit = men * 20;

      const data = {
        name: document.getElementById("name").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        hotel: document.getElementById("hotel").value.trim(),
        club: document.getElementById("club").value,
        date: document.getElementById("date").value,
        time: document.getElementById("time").value,
        men: men,
        women: women,
        guests: totalGuests,
        deposit: deposit,
        notes: document.getElementById("notes").value.trim()
      };

      try {
        const response = await fetch(webhookURL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          submitBtn.textContent = "Sent ✓";
          formMessage.textContent = "Reservation sent successfully.";
          formMessage.style.color = "#d4af37";

          form.reset();
          menInput.value = 1;
          womenInput.value = 0;
          updateDeposit();

          if (clubFromURL) {
            document.getElementById("club").value = decodeURIComponent(clubFromURL);
          }
        } else {
          formMessage.textContent = "There was an error sending the reservation.";
          formMessage.style.color = "#ff4d4d";
          submitBtn.disabled = false;
          submitBtn.textContent = "Reserve";
        }
      } catch (error) {
        formMessage.textContent = "Connection error. Please try again.";
        formMessage.style.color = "#ff4d4d";
        submitBtn.disabled = false;
        submitBtn.textContent = "Reserve";
      }
    });
  </script>

</body>
</html>
