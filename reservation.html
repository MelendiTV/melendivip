<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservation | Melendi VIP</title>
  <link rel="canonical" href="https://melendivip.com/reservation.html" />

  <style>
    body{
      margin:0;
      background:#07070b;
      font-family:Arial,sans-serif;
      color:#fff;
      padding:40px 20px;
    }

    .reservation-box{
      max-width:700px;
      margin:auto;
      background:#0f0f15;
      padding:30px;
      border-radius:16px;
      border:1px solid #2a2a2a;
    }

    .lang-switch{
      display:flex;
      justify-content:flex-end;
      gap:10px;
      margin-bottom:20px;
    }

    .lang-btn{
      background:#1a1a1f;
      color:#d4af37;
      border:1px solid #444;
      border-radius:8px;
      padding:8px 14px;
      font-size:14px;
      font-weight:bold;
      cursor:pointer;
    }

    .lang-btn.active{
      background:#d4af37;
      color:#000;
      border-color:#d4af37;
    }

    h1{
      text-align:center;
      color:#d4af37;
      margin-top:0;
      margin-bottom:25px;
    }

    .form-group{
      margin-bottom:16px;
    }

    .two-cols{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
      color:#d4af37;
    }

    input, select, textarea{
      width:100%;
      padding:12px;
      border-radius:8px;
      border:1px solid #444;
      background:#1a1a1f;
      color:white;
      box-sizing:border-box;
      font-size:16px;
    }

    textarea{
      min-height:110px;
      resize:vertical;
    }

    button{
      width:100%;
      padding:16px;
      background:linear-gradient(135deg,#d4af37,#b8962e);
      border:none;
      border-radius:12px;
      color:#000;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      margin-top:10px;
    }

    button:disabled{
      opacity:.7;
      cursor:not-allowed;
    }

    .message{
      margin-top:18px;
      text-align:center;
      font-weight:bold;
    }

    .deposit-box{
      margin-top:8px;
      margin-bottom:18px;
      padding:14px;
      border-radius:10px;
      background:#15151c;
      border:1px solid #2f2f38;
    }

    .deposit-line{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      font-size:16px;
    }

    .deposit-amount{
      color:#d4af37;
      font-weight:bold;
      font-size:18px;
    }

    .deposit-note{
      margin-top:8px;
      font-size:14px;
      line-height:1.4;
    }

    .highlight{
      color:#ffd700;
      font-weight:bold;
    }

    .back-home{
      display:inline-block;
      margin-top:20px;
      background:#d4af37;
      color:#000;
      padding:10px 16px;
      border-radius:8px;
      font-weight:bold;
      text-decoration:none;
    }

    @media (max-width:640px){
      .two-cols{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>

  <div class="reservation-box">

    <div class="lang-switch">
      <button class="lang-btn active" onclick="setLang('en', this)">EN</button>
      <button class="lang-btn" onclick="setLang('es', this)">ES</button>
    </div>

    <h1 id="title">VIP Reservation</h1>

    <form id="reservationForm">

      <div class="form-group">
        <label id="labelName">Full Name</label>
        <input type="text" id="name" required />
      </div>

      <div class="form-group">
        <label id="labelPhone">Phone / WhatsApp</label>
        <input type="tel" id="phone" required />
      </div>

      <div class="form-group">
        <label id="labelHotel">Hotel</label>
        <input type="text" id="hotel" required />
      </div>

      <div class="form-group">
        <label id="labelClub">Club</label>
        <select id="club" required>
          <option id="clubDefault">Select a club</option>
          <option>Sapphire</option>
          <option>Crazy Horse III</option>
          <option>Peppermint Hippo</option>
          <option>Spearmint Rhino</option>
          <option>Treasures</option>
          <option>Hustler Club</option>
          <option>Scores</option>
          <option>Little Darlings</option>
          <option>LVSC VIP Experience</option>
          <option>Deja Vu</option>
          <option>Palomino</option>
          <option>AIRSTRIP</option>
        </select>
      </div>

      <div class="two-cols">
        <div class="form-group">
          <label id="labelDate">Reservation Date</label>
          <input type="date" id="date" required />
        </div>

        <div class="form-group">
          <label id="labelTime">Reservation Time</label>
          <input type="time" id="time" required />
        </div>
      </div>

      <div class="two-cols">
        <div class="form-group">
          <label id="labelMen">Men</label>
          <input type="number" id="men" min="1" value="1" required />
        </div>

        <div class="form-group">
          <label id="labelWomen">Women</label>
          <input type="number" id="women" min="0" value="0" required />
        </div>
      </div>

      <div class="deposit-box">
        <div class="deposit-line">
          <span id="depositTitle">Required Deposit</span>
          <span class="deposit-amount" id="depositAmount">$20</span>
        </div>

        <div class="deposit-note">
          <span class="highlight" id="dep1"></span><br><br>
          <span class="highlight" id="dep2"></span><br><br>
          <span class="highlight" id="dep3"></span>
        </div>
      </div>

      <div class="form-group">
        <label id="labelNotes">Extra Notes</label>
        <textarea id="notes"></textarea>
      </div>

      <button type="submit" id="submitBtn">Reserve</button>
      <div class="message" id="formMessage"></div>

    </form>

    <a href="/" class="back-home" id="homeBtn">← Home</a>

  </div>

<script>
const webhookURL = "https://hook.us2.make.com/iy3l4sthq0wggcrpby9rntfbglfc9ttq";

const texts = {
  en:{
    title:"VIP Reservation",
    name:"Full Name",
    phone:"Phone / WhatsApp",
    hotel:"Hotel",
    club:"Club",
    clubDefault:"Select a club",
    date:"Reservation Date",
    time:"Reservation Time",
    men:"Men",
    women:"Women",
    notes:"Extra Notes",
    reserve:"Reserve",
    home:"← Home",
    dep1:"$20 deposit per male guest. Female guests are not charged. Minimum 1 male guest required.",
    dep2:"The $20 deposit is NON-REFUNDABLE if you cancel or do not show up at the agreed pickup location.",
    dep3:"If you arrive at the club, the deposit will be credited toward your promotion at the entrance."
  },
  es:{
    title:"Reservación VIP",
    name:"Nombre Completo",
    phone:"Teléfono / WhatsApp",
    hotel:"Hotel",
    club:"Club",
    clubDefault:"Selecciona un club",
    date:"Fecha de Reservación",
    time:"Hora de Reservación",
    men:"Hombres",
    women:"Mujeres",
    notes:"Notas Extras",
    reserve:"Reservar",
    home:"← Inicio",
    dep1:"Depósito de $20 por cada hombre. Las mujeres no pagan. Mínimo 1 hombre.",
    dep2:"El depósito de $20 NO ES REEMBOLSABLE si cancelas o no te presentas al punto acordado.",
    dep3:"Si llegas al club, el depósito se acredita a la promoción al entrar."
  }
};

function setLang(lang,btn){
  document.querySelectorAll(".lang-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  const t = texts[lang];

  document.getElementById("title").innerText = t.title;
  document.getElementById("labelName").innerText = t.name;
  document.getElementById("labelPhone").innerText = t.phone;
  document.getElementById("labelHotel").innerText = t.hotel;
  document.getElementById("labelClub").innerText = t.club;
  document.getElementById("clubDefault").innerText = t.clubDefault;
  document.getElementById("labelDate").innerText = t.date;
  document.getElementById("labelTime").innerText = t.time;
  document.getElementById("labelMen").innerText = t.men;
  document.getElementById("labelWomen").innerText = t.women;
  document.getElementById("labelNotes").innerText = t.notes;
  document.getElementById("submitBtn").innerText = t.reserve;
  document.getElementById("homeBtn").innerText = t.home;

  document.getElementById("dep1").innerText = t.dep1;
  document.getElementById("dep2").innerText = t.dep2;
  document.getElementById("dep3").innerText = t.dep3;
}

// INIT
setLang("en", document.querySelector(".lang-btn"));
</script>

</body>
</html>
