<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservation | Melendi VIP</title>

  <style>
    body{
      margin:0;
      background:#07070b;
      font-family:Arial,sans-serif;
      color:#fff;
      padding:40px 20px;
    }

    .reservation-box{
      max-width:700px;
      margin:auto;
      background:#0f0f15;
      padding:30px;
      border-radius:16px;
      border:1px solid #2a2a2a;
    }

    h1{
      text-align:center;
      color:#d4af37;
      margin-top:0;
      margin-bottom:25px;
    }

    .form-group{
      margin-bottom:16px;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
      color:#d4af37;
    }

    input, select, textarea{
      width:100%;
      padding:12px;
      border-radius:8px;
      border:1px solid #444;
      background:#1a1a1f;
      color:white;
      box-sizing:border-box;
      font-size:16px;
    }

    textarea{
      min-height:110px;
      resize:vertical;
    }

    button{
      width:100%;
      padding:16px;
      background:linear-gradient(135deg,#d4af37,#b8962e);
      border:none;
      border-radius:12px;
      color:#000;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      margin-top:10px;
    }

    button:disabled{
      opacity:.7;
      cursor:not-allowed;
    }

    .message{
      margin-top:18px;
      text-align:center;
      font-weight:bold;
    }

    .back-home{
      display:inline-block;
      margin-top:20px;
      background:#d4af37;
      color:#000;
      padding:10px 16px;
      border-radius:8px;
      font-weight:bold;
      text-decoration:none;
    }
  </style>
</head>
<body>

  <div class="reservation-box">
    <h1>VIP Reservation</h1>

    <form id="reservationForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required />
      </div>

      <div class="form-group">
        <label for="phone">Phone / WhatsApp</label>
        <input type="tel" id="phone" name="phone" required />
      </div>

      <div class="form-group">
        <label for="hotel">Hotel</label>
        <input type="text" id="hotel" name="hotel" required />
      </div>

      <div class="form-group">
        <label for="club">Club</label>
        <select id="club" name="club" required>
          <option value="">Select a club</option>
          <option value="Sapphire">Sapphire</option>
          <option value="Crazy Horse III">Crazy Horse III</option>
          <option value="Peppermint Hippo">Peppermint Hippo</option>
          <option value="Spearmint Rhino">Spearmint Rhino</option>
          <option value="Treasures">Treasures</option>
          <option value="Hustler Club">Hustler Club</option>
          <option value="Scores">Scores</option>
          <option value="Little Darlings">Little Darlings</option>
          <option value="LVSC VIP Experience">LVSC VIP Experience</option>
          <option value="Deja Vu">Deja Vu</option>
          <option value="Palomino">Palomino</option>
        </select>
      </div>

      <div class="form-group">
        <label for="date">Reservation Date</label>
        <input type="date" id="date" name="date" required />
      </div>

      <div class="form-group">
        <label for="time">Reservation Time</label>
        <input type="time" id="time" name="time" required />
      </div>

      <div class="form-group">
        <label for="guests">Number of Guests</label>
        <input type="number" id="guests" name="guests" min="1" required />
      </div>

      <div class="form-group">
        <label for="notes">Extra Notes</label>
        <textarea id="notes" name="notes" placeholder="Pickup details, special requests, etc."></textarea>
      </div>

      <button type="submit" id="submitBtn">Send Reservation</button>
      <div class="message" id="formMessage"></div>
    </form>

    <a href="/" class="back-home">← Home</a>
  </div>

  <script>
    const webhookURL = "https://hook.us2.make.com/iy3l4sthq0wggcrpby9rntfbglfc9ttq";

    const form = document.getElementById("reservationForm");
    const submitBtn = document.getElementById("submitBtn");
    const formMessage = document.getElementById("formMessage");

    const params = new URLSearchParams(window.location.search);
    const clubFromURL = params.get("club");

    if (clubFromURL) {
      const clubField = document.getElementById("club");
      clubField.value = decodeURIComponent(clubFromURL);
    }

    form.addEventListener("submit", async function(e){
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";
      formMessage.textContent = "";

      const data = {
        name: document.getElementById("name").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        hotel: document.getElementById("hotel").value.trim(),
        club: document.getElementById("club").value,
        date: document.getElementById("date").value,
        time: document.getElementById("time").value,
        guests: document.getElementById("guests").value,
        notes: document.getElementById("notes").value.trim()
      };

      try {
        const response = await fetch(webhookURL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        if (response.ok) {
  formMessage.textContent = "Reservation sent successfully.";
  formMessage.style.color = "#d4af37";

  const cleanPhone = data.phone.replace(/\D/g, "");
  const whatsappPhone = cleanPhone.length === 10 ? "1" + cleanPhone : cleanPhone;

  const whatsappMessage =
    `Your VIP reservation is confirmed at ${data.club} for ${data.guests} guests on ${data.date} at ${data.time}. We will contact you shortly.`;

  const whatsappURL =
    `https://wa.me/${whatsappPhone}?text=${encodeURIComponent(whatsappMessage)}`;

  form.reset();

  if (clubFromURL) {
    document.getElementById("club").value = decodeURIComponent(clubFromURL);
  }

  window.location.href = whatsappURL;
}

          if (clubFromURL) {
            document.getElementById("club").value = decodeURIComponent(clubFromURL);
          }
        } else {
          formMessage.textContent = "There was an error sending the reservation.";
          formMessage.style.color = "#ff4d4d";
        }
      } catch (error) {
        formMessage.textContent = "Connection error. Please try again.";
        formMessage.style.color = "#ff4d4d";
      }

      submitBtn.disabled = false;
      submitBtn.textContent = "Send Reservation";
    });
  </script>

</body>
</html>
