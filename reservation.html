<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reservation | Melendi VIP Promotions</title>

<link rel="canonical" href="https://melendivip.com/reservation.html" />

<meta name="description" content="Book your VIP experience in Las Vegas. Reserve free limo pickup, VIP entry, and nightlife services with Melendi VIP Promotions." />

<meta name="robots" content="index, follow">

<script src="https://js.stripe.com/v3/"></script>

<style>
body{
margin:0;
background:#07070b;
font-family:Arial,sans-serif;
color:#fff;
padding:40px 20px;
}

.reservation-box{
max-width:700px;
margin:auto;
background:#0f0f15;
padding:30px;
border-radius:16px;
border:1px solid #2a2a2a;
}

.lang-switch{
display:flex;
justify-content:flex-end;
gap:10px;
margin-bottom:20px;
}

.lang-btn{
background:#1a1a1f;
color:#d4af37;
border:1px solid #444;
border-radius:8px;
padding:8px 14px;
font-size:14px;
font-weight:bold;
cursor:pointer;
}

.lang-btn.active{
background:#d4af37;
color:#000;
}

h1{
text-align:center;
color:#d4af37;
margin-bottom:25px;
}

.form-group{margin-bottom:16px;}

.two-cols{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

label{
display:block;
margin-bottom:8px;
font-weight:bold;
color:#d4af37;
}

input, select, textarea{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #444;
background:#1a1a1f;
color:white;
font-size:16px;
}

textarea{min-height:110px;}

button{
width:100%;
padding:16px;
background:linear-gradient(135deg,#d4af37,#b8962e);
border:none;
border-radius:12px;
color:#000;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.deposit-box{
margin-top:8px;
margin-bottom:18px;
padding:14px;
border-radius:10px;
background:#15151c;
border:1px solid #2f2f38;
}

.deposit-amount{
color:#d4af37;
font-weight:bold;
font-size:18px;
}

.message{
margin-top:18px;
text-align:center;
font-weight:bold;
}

.back-home{
display:inline-block;
margin-top:20px;
background:#d4af37;
color:#000;
padding:10px 16px;
border-radius:8px;
font-weight:bold;
text-decoration:none;
}

#checkout-wrapper{
display:none;
margin-top:24px;
padding:18px;
border-radius:12px;
background:#15151c;
border:1px solid #2f2f38;
}

@media (max-width:640px){
.two-cols{grid-template-columns:1fr;}
}
</style>

</head>

<body>

<div class="reservation-box">

<div class="lang-switch">
<button class="lang-btn active" onclick="setLanguage('en')">EN</button>
<button class="lang-btn" onclick="setLanguage('es')">ES</button>
</div>

<h1 id="title">VIP Reservation</h1>

<form id="form">

<div class="form-group">
<label id="nameLabel">Full Name</label>
<input id="name" required>
</div>

<div class="form-group">
<label id="phoneLabel">Phone / WhatsApp</label>
<input id="phone" required>
</div>

<div class="form-group">
<label id="hotelLabel">Hotel</label>
<input id="hotel" required>
</div>

<div class="form-group">
<label id="clubLabel">Club</label>
<select id="club" required>
<option value="">Select a club</option>
<option>Sapphire</option>
<option>Crazy Horse III</option>
<option>Peppermint Hippo</option>
<option>Spearmint Rhino</option>
<option>Treasures</option>
<option>Hustler Club</option>
<option>Scores</option>
<option>Deja Vu</option>
</select>
</div>

<div class="two-cols">
<div class="form-group">
<label>Date</label>
<input type="date" id="date" required>
</div>

<div class="form-group">
<label>Time</label>
<input type="time" id="time" required>
</div>
</div>

<div class="two-cols">
<div class="form-group">
<label>Men</label>
<input type="number" id="men" value="1" min="1">
</div>

<div class="form-group">
<label>Women</label>
<input type="number" id="women" value="0">
</div>
</div>

<div class="deposit-box">
Deposit: <span class="deposit-amount" id="deposit">$20</span>
</div>

<div class="form-group">
<label>Notes</label>
<textarea id="notes"></textarea>
</div>

<button type="submit">Reserve</button>

<div class="message" id="msg"></div>

<div id="checkout-wrapper">
<h3>Complete Deposit</h3>
<div id="checkout"></div>
</div>

</form>

<a href="/" class="back-home">← Home</a>

</div>

<script>
const stripe = Stripe("pk_test_51TEOMzCIZy2PbDmuW3BHyJzvc7pzruIgWDCrdlV9z1X4hgitnrV4csBlopHrsCe73YqkuGVBYrEMFOqeRbb4nypA00T6WklNND");

function updateDeposit(){
let men = document.getElementById("men").value || 0;
document.getElementById("deposit").innerText = "$" + (men * 20);
}

document.getElementById("men").addEventListener("input", updateDeposit);

function setLanguage(lang){
if(lang==="es"){
document.getElementById("title").innerText="Reservación VIP";
}else{
document.getElementById("title").innerText="VIP Reservation";
}
}

document.getElementById("form").addEventListener("submit", async(e)=>{
e.preventDefault();

document.getElementById("msg").innerText="Processing...";

const data={
name:name.value,
phone:phone.value,
hotel:hotel.value,
club:club.value,
date:date.value,
time:time.value,
men:men.value,
women:women.value,
notes:notes.value
};

await fetch("https://hook.us2.make.com/iy3l4sthq0wggcrpby9rntfbglfc9ttq",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

document.getElementById("msg").innerText="Reservation sent ✔";
});
</script>

<!-- SEO HUB -->

<section style="margin-top:50px;padding:30px;background:#0b0b10;">
<h2 style="color:#d4af37;text-align:center;">
Las Vegas Strip Clubs & VIP Services
</h2>

<p style="text-align:center;color:#ccc;">
Explore VIP nightlife, free limo pickup and top strip clubs in Las Vegas with Melendi VIP Promotions.
</p>

</section>

</body>
</html>
